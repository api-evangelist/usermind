name: Usermind
description: Usermind was a Seattle-based journey and experience orchestration platform
  that captured and analyzed contextual data at every touchpoint of the customer journey
  to personalize experiences across channels, and was named a Leader in The Forrester
  Wave Journey Orchestration Platforms, Q2 2020. Backed by a16z and Menlo Ventures,
  the company was acquired by Qualtrics (announced July 20, 2021); usermind.com now
  redirects to qualtrics.com and no independent Usermind API surface remains.
